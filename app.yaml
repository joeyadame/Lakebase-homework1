command:
  - "python"
  - "app.py"

env:
  - name: ENDPOINT_NAME
    valueFrom: lakebase-db
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

resources:
  - name: lakebase-db
    lakebase:
      project_name: bootcamp
      branch: production
      endpoint: default
